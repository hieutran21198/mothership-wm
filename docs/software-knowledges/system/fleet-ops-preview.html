  :root {
    --page: #04070c;
    --ink: #e6f1f6;
    --ink2: #9fb3c0;
    --mute: #5d7180;
    --cyan: #56d4dd;
    --amber: #f2c14e;
    --line: #233543;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body { font-family: "Chakra Petch", sans-serif; font-size: 14px; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 56px;
  }
  header h1 { margin: 0; font: 400 18px "Black Ops One", "Chakra Petch", sans-serif; letter-spacing: .04em; }
  .draft {
    border: 1px solid var(--amber); color: var(--amber); padding: 3px 10px;
    font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 12px;
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
  }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  nav button {
    font: 500 13px "Chakra Petch", sans-serif; color: var(--ink2); background: #0d1822;
    border: 1px solid #22394a; padding: 6px 12px; cursor: pointer;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  nav button[aria-selected="true"] { color: var(--ink); border-color: var(--cyan); background: #10303a; }
  nav button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  main { padding: 12px 16px 28px; }
  #frame { position: relative; margin: 0 auto; background: #000; }
  #frame svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline;
    margin: 10px auto 0; padding: 8px 12px; border: 1px solid var(--line); background: #08111a;
  }
  .caption strong { font-weight: 600; }
  .caption .tag { color: var(--amber); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .caption .hint { color: var(--mute); margin-left: auto; font-size: 12px; }
  .notes { margin: 10px auto 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .notes section { border: 1px solid var(--line); background: #07101a; padding: 10px 12px; }
  .notes h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
  .notes ul { margin: 0; padding-left: 18px; color: #c4d4dd; line-height: 1.45; }
  .legend { display: grid; grid-template-columns: 56px 1fr; gap: 6px 10px; align-items: center; color: #c4d4dd; }
  .legend svg { width: 56px; height: 44px; background: #0a1520; }
  .hide-annot .annot { display: none; }
</style>

const BODY = "'Chakra Petch', sans-serif";
const TITLE = "'Black Ops One', 'Chakra Petch', sans-serif";
let uid = 0;
const id = (p) => `${p}${++uid}`;

/* ---------- geometry ---------- */
const f2 = (n) => Math.round(n * 100) / 100;
function dedupe(pts) {
  const out = [];

    const q = out[out.length - 1];

}

/* 45° chamfered rectangle; c = number or [tl,tr,br,bl]; equal x/y runs */
function cham(x, y, w, h, c) {
  const [a, b, d, e] = Array.isArray(c) ? c : [c, c, c, c];
  return dedupe([[x + a, y], [x + w - b, y], [x + w, y + b], [x + w, y + h - d],

}
/* inward parallel offset: shift each edge along its normal, intersect neighbours */
function offset(pts, d) {
  let area = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    area += p[0] * q[1] - q[0] * p[1];

  const s = area > 0 ? 1 : -1;
  const lines = pts.map((p, i) => {
    const q = pts[(i + 1) % pts.length];
    let dx = q[0] - p[0], dy = q[1] - p[1];
    const L = Math.hypot(dx, dy); dx /= L; dy /= L;
    const nx = -dy * s, ny = dx * s;
    return { p: [p[0] + nx * d, p[1] + ny * d], d: [dx, dy] };

    const m = lines[(i - 1 + lines.length) % lines.length];
    const cr = m.d[0] * l.d[1] - m.d[1] * l.d[0];
    if (Math.abs(cr) < 1e-9) return l.p;
    const t = ((l.p[0] - m.p[0]) * l.d[1] - (l.p[1] - m.p[1]) * l.d[0]) / cr;
    return [m.p[0] + m.d[0] * t, m.p[1] + m.d[1] * t];

  const font = o.title ? TITLE : BODY;
  return `<text x="${x}" y="${y}" font-family="${font}" font-size="${o.size || 13}" ` +
    `fill="${o.fill || C.ink}" font-weight="${o.weight || 400}" text-anchor="${o.anchor || "start"}" ` +
    `${o.ls ? `letter-spacing="${o.ls}"` : ""} ${o.op ? `opacity="${o.op}"` : ""} ${o.extra || ""}>${s}</text>`;
}
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* ---------- shared marks ---------- */
/* four separated 45° corner marks (analog family) */
function corners(x, y, w, h, len, k, color, sw, op = 1) {
  const m = (pts) => `<polyline points="${P(pts)}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="miter" stroke-linecap="square" opacity="${op}"/>`;
  return m([[x, y + len], [x, y + k], [x + k, y], [x + len, y]]) +
    m([[x + w - len, y], [x + w - k, y], [x + w, y + k], [x + w, y + len]]) +
    m([[x + w, y + h - len], [x + w, y + h - k], [x + w - k, y + h], [x + w - len, y + h]]) +
    m([[x + len, y + h], [x + k, y + h], [x, y + h - k], [x, y + h - len]]);

    t(x + w / 2, y + h / 2 + 4, esc(label), { size: o.size || 11, anchor: "middle", fill: o.on ? C.cyanHi : C.ink2, weight: 600 }) + `</g>`;
}

function keyRow(x, y, labels, gap = 6, o = {}) {
  let s = "", cx = x;
  for (const l of labels) { s += keycap(cx, y, l, o); cx += keyW(l, o.h) + gap; }

}

function openBtn(x, y, w, h, inner, state = "rest") {
  let s = poly(cham(x, y, w, h, 4), `fill="${state === "rest" ? "rgba(40,66,84,0.35)" : "rgba(44,78,98,0.5)"}"`);

  if (state === "focus") s += `<g filter="url(#softglow)">${corners(x - 2, y - 2, w + 4, h + 4, 10, 4, C.cyanHi, 1.6)}</g>`;
  return s + inner;
}

  s += `<polyline points="${P([[x + 6, y + 1.5], [x + w - 6, y + 1.5]])}" stroke="#5a6f7c" stroke-width="1" opacity=".7"/>`;
  s += `<g transform="translate(${x + w / 2 - 10},${y + h / 2 - 10})" stroke="${o.on ? C.cyanHi : "#b2cad5"}" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">${G[glyph]}</g>`;

}

    { n: "Ops", segs: [[8.6, 9.0], [11.5, 12.0], [15.2, 15.5]], tot: "1h 12m" },
    { n: "Research", segs: [[16.0, 17.6]], tot: "1h 36m" },
    { n: "Review", segs: [[17.6, 18.4], [20.2, 20.9]], tot: "1h 30m" },
    { n: "Lab", segs: [[12.0, 12.5]], tot: "0h 30m", del: true },
  ];
  const lh = 40;
  lanes.forEach((ln, i) => {
    const ly = ay + 20 + i * lh;
    s += `<line x1="${lx}" y1="${ly + lh}" x2="${x + w - 26}" y2="${ly + lh}" stroke="#203240"/>`;
    const op = ln.del ? 0.5 : 1;
    if (ln.def) s += `<polygon points="${P([[lx + 9, ly + 12], [lx + 16, ly + 20], [lx + 9, ly + 28], [lx + 2, ly + 20]])}" fill="none" stroke="${C.ink2}" stroke-width="1.3"/>`;
    else s += `<g opacity="${op}">${nodeShip(lx + 9, ly + 20, 0.16, {})}</g>`;
    s += t(lx + 26, ly + 25, esc(ln.n), { title: !ln.def, size: 14, fill: ln.del ? C.mute : "#d6e6ee" });
    if (ln.del) s += t(lx + 26 + 30, ly + 25, "(deleted)", { size: 11, fill: C.mute });
    for (const [a, b] of ln.segs) {
      const sx = ax + (aw * a) / 24, ex = ax + (aw * b) / 24;
      s += `<rect x="${f2(sx)}" y="${ly + 15}" width="${f2(ex - sx)}" height="10" fill="${ln.del ? "#4d6573" : C.cyan}" opacity="${ln.del ? 0.7 : 0.78}"/>`;
    }
    if (ln.live) {
      const ex = ax + (aw * 21.67) / 24;
      s += `<rect x="${f2(ex - 3)}" y="${ly + 11}" width="3" height="18" fill="${C.cyanHi}" filter="url(#softglow)"/>`;
    }
    s += t(tx, ly + 25, ln.tot, { size: 13, anchor: "end", weight: 600, fill: ln.del ? C.mute : C.ink });
  });
  const nowx = ax + (aw * 21.67) / 24;
  s += `<line x1="${f2(nowx)}" y1="${ay + 8}" x2="${f2(nowx)}" y2="${ay + 20 + lanes.length * lh}" stroke="${C.cyanHi}" stroke-dasharray="3 3" stroke-opacity=".7"/>`;
  s += t(nowx, ay + 20 + lanes.length * lh + 14, "now 21:40", { size: 10, fill: C.cyanHi, anchor: "middle" });
  s += t(tx, ay + 20 + lanes.length * lh + 30, "Today 10h 00m", { size: 12, anchor: "end", fill: C.ink2, weight: 600 });
  const fy = y + h - 40;
  s += `<line x1="${x + 20}" y1="${fy - 12}" x2="${x + w - 20}" y2="${fy - 12}" stroke="#2a3f4c"/>`;
  s += keyRow(x + 26, fy, ["A", "D", "Esc"], 8).s;
  s += t(x + 130, fy + 14, "Local only · Node names and times, never window titles", { size: 11, fill: C.mute });
  s += openBtn(x + w - 150, fy - 4, 124, 28, t(x + w - 88, fy + 14, "Clear history", { size: 13, anchor: "middle", weight: 600 }), "rest");
  /* guide inset (log closed) */
  s += `<g class="annot">` + poly(cham(40, 40, 300, 84, 6), `fill="rgba(30,22,4,0.6)" stroke="${C.amber}" stroke-dasharray="5 4"`) +
    t(54, 62, "Home guide when the log is closed", { size: 12, fill: "#f6e7bf" }) + homeGuide(54, 80, true) + `</g>`;
  s += note(40, 140, ["L opens the Mission Log on blank Home;", "also Slash `missions`"], {});
  s += note(1160, 470, ["Live segment", "brighter end cap"], { to: [nowx + 2, ay + 20 + lh + 20], w: 130 });
  return s;
}

/* ================= shell ================= */
const SCENES = [
  { name: "Center Map · Live ship status", feat: "#7 Live ship status · Detail rows for #1 and #6", fn: scene1,
    notes: [["Marker states", "legend"], ["Rules kept", ["Badge and pulse are the existing notification feedback.", "Comms arcs show only while a member app has an identifiable playback stream; static with Motion Off.", "Cloak keeps the label at full contrast; no idle glow or ring is added.", "Detail adds two rows; it still has no notification or volume controls."]]] },
  { name: "Node Panel · Loadout + Silent running", feat: "#1 Node loadouts · #2 Silent running", fn: scene2,
    notes: [["Loadout", ["Saved per Node from Settings; up to eight entries.", "Launches through the App Grid launch marker, so each new window joins Research.", "Launch on entry Off by default; the empty tray offers the button."]], ["Silent running", ["Latched wing toggle mirrors Settings.", "Notices: no toasts or Map pulses while inside; log still records.", "Notices + audio: also mutes playback of other Nodes, restoring only what it muted.", "Leaving the Node posts one digest toast."]]] },
  { name: "Comms pin", feat: "#3 Comms pin", fn: scene3,
    notes: [["Behavior", ["One pin per session; Meta + P toggles it on the focused window.", "WM draws it from the window's existing buffer, 320 px wide, 16 px above the rail.", "Click flies to the owning Node and focuses that exact window.", "Pin disappears when the window closes; hidden in its own Node and in Map."]]] },
  { name: "Tractor beam", feat: "#4 Tractor beam", fn: scene4,
    notes: [["Behavior", ["Drag starts on a tray card after a small threshold; the WM owns the pointer.", "Targets reuse the Vector Strip visuals; Current and Full reject.", "Drop calls the existing Attach / Move; nothing changes on Esc.", "Meta + Shift + 1–9 is the keyboard equivalent."]]] },
  { name: "Slash · windows", feat: "#5 Window search in Slash", fn: scene5,
    notes: [["Behavior", ["`windows <query>` matches title, app ID and app name across all Nodes and Default.", "Rows show app icon, one-line title and the Node with its number key.", "Enter flies to the Node and focuses that window; Esc cancels."]]] },
  { name: "Mission Log", feat: "#6 Mission log", fn: scene6,
    notes: [["Behavior", ["desktopd records acknowledged Node entries and exits locally.", "A / D change the day; Esc closes. Deleted Nodes keep history, muted.", "Clear history removes the local record after confirmation.", "No titles, app names or content are stored."]]] },
];
let current = 0, annot = true;
const frame = document.getElementById("frame");
const tabs = document.getElementById("tabs");
SCENES.forEach((sc, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.role = "tab"; b.textContent = `${i + 1} · ${sc.name}`;
  b.addEventListener("click", () => show(i));
  tabs.appendChild(b);
});
function fit() {
  const avail = Math.max(320, window.innerWidth - 32);
  const availH = Math.max(240, window.innerHeight - document.querySelector("header").offsetHeight - 24 - 70);
  const s = Math.min(avail / 1440, availH / 900);
  frame.style.width = `${1440 * s}px`; frame.style.height = `${900 * s}px`;
  document.getElementById("caption").style.width = frame.style.width;
  document.getElementById("notes").style.width = frame.style.width;
}
function show(i) {
  current = i; uid = 0;
  const sc = SCENES[i];
  frame.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="${sc.name}">${defs()}${sc.fn()}</svg>`;
  [...tabs.children].forEach((b, j) => b.setAttribute("aria-selected", j === i ? "true" : "false"));
  document.getElementById("caption").innerHTML =
    `<strong>${i + 1}. ${sc.name}</strong><span>${sc.feat}</span><span class="tag">Illustrative data · Draft concept — not approved</span><span class="hint">Keys 1–6 switch scenes · H toggles annotations</span>`;
  document.getElementById("notes").innerHTML = sc.notes.map(([h, body]) => {
    if (body === "legend") {
      const L = [["idle", "Idle — no idle ring or glow"], ["badge", "Unread — existing lavender badge"], ["comms", "Comms — member app is playing audio"], ["cloak", "Cloaked — Silent running on"], ["sel", "Selected — brighter outside silhouette"]];
      return `<section><h2>${h}</h2><div class="legend">${L.map(([k, d]) => `${legendSvg(k)}<span>${d}</span>`).join("")}</div></section>`;
    }
    return `<section><h2>${h}</h2><ul>${body.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></section>`;
  }).join("");
  if (location.hash !== `#${i + 1}`) history.replaceState(null, "", `#${i + 1}`);
}
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  const n = Number(e.key);
  if (n >= 1 && n <= SCENES.length) show(n - 1);
  if (e.key === "h" || e.key === "H") { annot = !annot; document.body.classList.toggle("hide-annot", !annot); }
});
window.addEventListener("resize", fit);
if (/[?&]annot=0/.test(location.search)) { annot = false; document.body.classList.add("hide-annot"); }
fit();
show(Math.min(SCENES.length - 1, Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1)));
document.fonts && document.fonts.ready.then(fit);
</script>
