  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  .preview { width: 100%; max-width: 1440px; margin-inline: auto; }
  .desktop {
    --line: #91c4d4;
    --ink: #e8f4f7;
    --focus: #c6f5ff;
    --seam: #547884;
    --surface: #0b1822;
    position: relative;
    isolation: isolate;
    aspect-ratio: 1440 / 760;
    overflow: hidden;
    background: #0d1420;
    color: var(--ink);
    font: 500 14px/1.25 "Chakra Petch", system-ui, sans-serif;
  }
  .desktop canvas, .input-plane { position: absolute; inset: 0; width: 100%; height: 100%; }
  .input-plane {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: crosshair;
  }
  .input-plane:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .input-plane[data-mode="window"] { cursor: default; }
  .input-plane[data-mode="display"] { cursor: default; }
  .blank-shade { position: absolute; inset: 0; background: rgba(3, 9, 16, .59); pointer-events: none; }
  .selection {
    position: absolute;
    border: 1px solid #b5e6ee;
    box-shadow: 0 0 0 1600px rgba(3, 9, 16, .59), inset 0 0 0 1px #152c3a;
    cursor: move;
  }
  .selection[data-mode="window"] { cursor: pointer; }
  .selection[data-mode="display"] { pointer-events: none; border-width: 2px; }
  .selection[data-hover="true"] { border-style: dashed; }
  .handle {
    position: absolute;
    width: 18px;
    height: 18px;
    display: grid;
    place-items: center;
    transform: translate(-50%, -50%);
  }
  .handle::after {
    content: "";
    width: 8px;
    height: 8px;
    border: 1px solid #bde5ee;
    background: #193642;
    box-shadow: 0 0 0 1px #07111a;
  }
  .handle[data-edge="nw"], .handle[data-edge="se"] { cursor: nwse-resize; }
  .handle[data-edge="ne"], .handle[data-edge="sw"] { cursor: nesw-resize; }
  .handle[data-edge="nw"], .handle[data-edge="sw"] { left: 0; }
  .handle[data-edge="ne"], .handle[data-edge="se"] { left: 100%; }
  .handle[data-edge="nw"], .handle[data-edge="ne"] { top: 0; }
  .handle[data-edge="sw"], .handle[data-edge="se"] { top: 100%; }
  .selection[data-mode]:not([data-mode="area"]) .handle,
  .selection[data-drawing="true"] .handle { display: none; }
  .dimensions {
    position: absolute;
    pointer-events: none;
    white-space: nowrap;
    background: var(--surface);
    border: 1px solid var(--seam);
    padding: 3px 7px;
    color: var(--ink);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .anchor {
    position: absolute;
    width: 13px;
    height: 13px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    background: linear-gradient(var(--line),var(--line)) center / 1px 100% no-repeat,
                linear-gradient(var(--line),var(--line)) center / 100% 1px no-repeat;
  }

  .bar {
    --cut: 7px;
    --inner-cut: 6.4px;
    position: absolute;
    z-index: 1;
    bottom: 19.6%;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100% - 20px);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    background: var(--seam);
    clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut),
      100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%,
      0 calc(100% - var(--cut)), 0 var(--cut));
  }
  .bar::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 1px;
    background: linear-gradient(180deg, #152732, #0b1722);
    clip-path: polygon(var(--inner-cut) 0, calc(100% - var(--inner-cut)) 0, 100% var(--inner-cut),
      100% calc(100% - var(--inner-cut)), calc(100% - var(--inner-cut)) 100%, var(--inner-cut) 100%,
      0 calc(100% - var(--inner-cut)), 0 var(--inner-cut));
  }
  .controls { display: flex; align-items: center; gap: 3px; }
  .actions { padding-left: 8px; border-left: 1px solid #335663; }
  .desktop button {
    position: relative;
    min-height: 32px;
    border: 0;
    padding: 5px 10px;
    background: #101e29;
    color: var(--ink);
    font: inherit;
    white-space: nowrap;
    cursor: pointer;
    clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px,
      100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
  }
  .desktop button::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: var(--line);
    opacity: 0;
    clip-path: polygon(evenodd, 4px 0, calc(100% - 4px) 0, 100% 4px,
      100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px),
      0 4px, 4px 0, 4.4px 1px, 1px 4.4px, 1px calc(100% - 4.4px),
      4.4px calc(100% - 1px), calc(100% - 4.4px) calc(100% - 1px),
      calc(100% - 1px) calc(100% - 4.4px), calc(100% - 1px) 4.4px,
      calc(100% - 4.4px) 1px, 4.4px 1px);
    mask: linear-gradient(#000 0 0) left top / 9px 9px no-repeat,
      linear-gradient(#000 0 0) right top / 9px 9px no-repeat,
      linear-gradient(#000 0 0) left bottom / 9px 9px no-repeat,
      linear-gradient(#000 0 0) right bottom / 9px 9px no-repeat;
  }
  .desktop button:enabled:hover::after { opacity: .8; }
  .desktop button:focus-visible { outline: none; }
  .desktop button:focus-visible::after { opacity: 1; background: var(--focus); }
  .desktop button:enabled:active { background: #274654; }
  .desktop button[aria-pressed="true"] { background: #234353; color: #eaffff; }
  .desktop button:disabled { color: #91a4ad; cursor: default; }
  .desktop .copy:enabled { background: #a2d9e2; color: #071923; }
  .desktop .copy:focus-visible::after { background: #062937; }
  .desktop .cancel { width: 32px; padding: 0; font-size: 19px; line-height: 1; }
  .desktop .launcher {
    position: absolute;
    left: 50%;
    bottom: 19.6%;
    transform: translateX(-50%);
    padding-inline: 15px;
    background: #1d3847;
    box-shadow: inset 0 0 0 1px #7297a4;
  }
  .launcher kbd { font: inherit; margin-left: 9px; color: #b5d0db; }
  .guide, .result {
    font: 500 13px/1.4 "Chakra Petch", system-ui, sans-serif;
    color: var(--foreground, light-dark(#20313e, #dce6ec));
  }
  .guide { margin: 8px 0 0; min-height: 2.8em; }
  .guide .hint { color: var(--muted-foreground, light-dark(#465766, #9fb0bc)); }
  .result { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  .result img { width: 80px; height: 45px; object-fit: contain; background: var(--card, #111b24); }
  .result p { margin: 0 0 2px; }
  .result a { color: var(--foreground, light-dark(#1d4255, #e3f2f6)); }
  @media (max-width: 460px) {
    .bar { flex-wrap: wrap; justify-content: center; column-gap: 4px; row-gap: 2px; }
    .desktop button { min-height: 28px; padding-inline: 6px; font-size: 12px; }
    .desktop .cancel { width: 23px; font-size: 17px; }
    .actions { padding-left: 4px; }
    .dimensions { font-size: 10px; }
  }
  @media (max-width: 350px) {
    .controls { gap: 2px; }
    .desktop button { padding-inline: 4px; font-size: 11px; }
    .actions { padding-left: 3px; }
  }
  @media (forced-colors: active) {
    .desktop button, .bar { border: 1px solid ButtonText; }
    .desktop button:focus-visible { outline: 2px solid Highlight; outline-offset: -3px; }
    .desktop button[aria-pressed="true"] { color: HighlightText; background: Highlight; forced-color-adjust: none; }
  }
</style>
</head>
<body>
<main class="preview" aria-label="Mothership Screenshot design preview">
  <div class="desktop" id="desktop">
    <canvas id="scene" width="1440" height="760" aria-label="Sample Mothership desktop with two overlapping app windows"></canvas>
    <div class="input-plane" id="plane" data-mode="area" tabindex="0" role="region" aria-label="Capture selection" aria-describedby="guide" aria-keyshortcuts="W A S D">
      <div id="shade" class="blank-shade"></div>
      <div id="selection" class="selection" data-mode="area" hidden>
        <span class="handle" data-edge="nw"></span><span class="handle" data-edge="ne"></span>
        <span class="handle" data-edge="sw"></span><span class="handle" data-edge="se"></span>
      </div>
      <span class="anchor" id="anchor" hidden></span>
      <output id="dimensions" class="dimensions" aria-live="off" hidden></output>
    </div>
    <div class="bar" id="bar" aria-label="Screenshot controls" role="group">
      <div class="controls" role="group" aria-label="Capture mode">
        <button type="button" data-mode="area" aria-pressed="true">Area</button>
        <button type="button" data-mode="window" aria-pressed="false">Window</button>
        <button type="button" data-mode="display" aria-pressed="false">Display</button>
      </div>
      <div class="controls actions" role="group" aria-label="Capture actions">
        <button type="button" class="copy" id="copy" disabled>Copy</button>
        <button type="button" id="save" disabled>Save PNG</button>
        <button type="button" class="cancel" id="cancel" aria-label="Cancel screenshot">×</button>
      </div>
    </div>
    <button type="button" id="launcher" class="launcher" hidden>Screenshot <kbd>Print</kbd></button>
  </div>
  <p id="guide" class="guide" aria-live="polite">
    Drag to select an area. <span class="hint">Esc cancels.</span>
  </p>
  <div class="result" id="result" hidden>
    <img id="thumbnail" alt="Captured image">
    <div>
      <p id="result-status" role="status"></p>
      <a id="result-file" download>Download captured PNG</a>
    </div>
  </div>
</main>
<script>
  const find = (id) => document.getElementById(id);
  const scene = find("scene");
  const context = scene.getContext("2d");
  const plane = find("plane");
  const bar = find("bar");
  const selection = find("selection");
  const dimensions = find("dimensions");
  const launcher = find("launcher");
  const copy = find("copy");
  const save = find("save");
  const modeButtons = [...bar.querySelectorAll("[data-mode]")];
  const output = { x: 0, y: 0, w: scene.width, h: scene.height };
  const example = { x: 117, y: 128, w: 660, h: 300 };
  const windows = [
    { name: "Workspace Notes", asset: "notes-image", x: 84, y: 84, w: 790, h: 500 },
    { name: "Files", asset: "files-image", x: 823, y: 226, w: 430, h: 320 }
  ];
  const instructions = {
    area: ["Drag to select, move, or resize.", "Two clicks set opposite corners. W/A/S/D moves, Shift resizes, Esc cancels."],
    window: ["Click a window to select it.", "W and S cycle windows when the scene has focus."],
    display: ["The whole display is selected.", "Choose Copy or Save PNG."],
    closed: ["Open Screenshot or press Print while this preview has focus.", ""]
  };
  let active = true;
  let ready = false;
  let mode = "area";
  let area = { ...example };
  let selectedWindow = null;
  let hoveredWindow = null;
  let drag = null;
  let firstCorner = null;
  let resultURL = null;
  let exporting = false;

  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const percent = (n, size) => (100 * n / size) + "%";

  function image(id) {
    const asset = new Image();
    asset.src = find(id).textContent.trim();
    return asset.decode().then(() => asset);
  }

  async function loadScene() {
    const [wallpaper, ...apps] = await Promise.all([image("desktop-image"), ...windows.map((win) => image(win.asset))]);
    context.drawImage(wallpaper, 0, 0, output.w, output.h);
    for (const [index, win] of windows.entries()) {
      win.image = apps[index];
      context.save();
      context.shadowBlur = 30;
      context.shadowOffsetY = 10;
      context.shadowColor = "rgba(0, 0, 0, .55)";
      context.drawImage(win.image, win.x, win.y, win.w, win.h);
      context.restore();
    }
    ready = true;
    paint();
    if (active) showInstructions();
  }

  function currentSelection() {
    if (mode === "display") return output;
    if (mode === "window") return selectedWindow || hoveredWindow;
    return area;
  }

  function canExport() {
    if (!ready || drag || exporting) return false;
    if (mode === "window") return Boolean(selectedWindow);
    const box = currentSelection();
    return Boolean(box && box.w >= 2 && box.h >= 2);
  }

  function place(element, x, y) {
    element.style.left = percent(x, output.w);
    element.style.top = percent(y, output.h);
  }

  function paint() {
    if (!active) return;
    const box = currentSelection();
    find("shade").hidden = Boolean(box);
    selection.hidden = !box;
    dimensions.hidden = !box || box.w < 2 || box.h < 2;
    plane.dataset.mode = selection.dataset.mode = mode;
    selection.dataset.hover = String(mode === "window" && !selectedWindow);
    selection.dataset.drawing = String(drag?.kind === "draw");
    if (box) {
      place(selection, box.x, box.y);
      selection.style.width = percent(box.w, output.w);
      selection.style.height = percent(box.h, output.h);
      dimensions.value = box.name
        ? box.name + " · " + box.w + " × " + box.h
        : box.w + " × " + box.h + " px";
      const labelWidth = dimensions.offsetWidth;
      const labelHeight = dimensions.offsetHeight;
      const scaleX = output.w / plane.clientWidth;
      const scaleY = output.h / plane.clientHeight;
      const left = clamp(box.x + 5 * scaleX, 5 * scaleX, output.w - (labelWidth + 5) * scaleX);
      const top = box.y >= (labelHeight + 7) * scaleY
        ? box.y - (labelHeight + 5) * scaleY
        : box.y + 5 * scaleY;
      place(dimensions, left, top);
    }
    find("anchor").hidden = !firstCorner;
    if (firstCorner) place(find("anchor"), firstCorner.x, firstCorner.y);
    copy.disabled = save.disabled = !canExport();
  }

  function showInstructions() {
    const [message, hint] = instructions[active ? mode : "closed"];
    const secondary = document.createElement("span");
    secondary.className = "hint";
    secondary.textContent = hint;
    find("guide").replaceChildren(message + " ", secondary);
  }

  function setMode(next) {
    mode = next;
    drag = firstCorner = selectedWindow = hoveredWindow = null;
    for (const button of modeButtons) button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
    paint();
    showInstructions();
  }

  function openTool() {
    active = true;
    area = null;
    plane.hidden = bar.hidden = false;
    launcher.hidden = true;
    find("result").hidden = true;
    setMode("area");
    modeButtons[0].focus({ preventScroll: true });
  }

  function closeTool() {
    active = false;
    drag = firstCorner = null;
    plane.hidden = bar.hidden = true;
    launcher.hidden = false;
    showInstructions();
    launcher.focus({ preventScroll: true });
  }

  function point(event) {
    const bounds = plane.getBoundingClientRect();
    return {
      x: Math.round(clamp((event.clientX - bounds.left) * output.w / bounds.width, 0, output.w)),
      y: Math.round(clamp((event.clientY - bounds.top) * output.h / bounds.height, 0, output.h))
    };
  }

  function rectangle(a, b) {
    return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) };
  }

  function moveBox(box, dx, dy) {
    return { ...box, x: clamp(box.x + dx, 0, output.w - box.w), y: clamp(box.y + dy, 0, output.h - box.h) };
  }

  function windowAt(p) {
    return windows.findLast((win) => p.x >= win.x && p.x < win.x + win.w && p.y >= win.y && p.y < win.y + win.h) || null;
  }

  plane.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || !event.isPrimary || exporting) return;
    const start = point(event);
    if (mode === "window") {
      selectedWindow = windowAt(start);
      paint();
      return;
    }
    if (mode !== "area") return;
    const edge = event.target.dataset.edge;
    const hitSelection = event.target.closest("#selection");
    const kind = edge ? "resize" : hitSelection ? "move" : "draw";
    drag = { pointer: event.pointerId, kind, start, before: area && { ...area }, moved: false };
    if (edge && area) {
      drag.fixed = {
        x: edge.includes("w") ? area.x + area.w : area.x,
        y: edge.includes("n") ? area.y + area.h : area.y
      };
    }
    plane.setPointerCapture(event.pointerId);
  });

  plane.addEventListener("pointermove", (event) => {
    const here = point(event);
    if (mode === "window" && !selectedWindow) {
      const hit = windowAt(here);
      if (hit !== hoveredWindow) {
        hoveredWindow = hit;
        paint();
      }
    }
    if (!drag || drag.pointer !== event.pointerId) return;
    const dx = here.x - drag.start.x;
    const dy = here.y - drag.start.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    if (drag.kind === "move") area = moveBox(drag.before, dx, dy);
    else if (drag.kind === "resize") area = rectangle(drag.fixed, here);
    else area = rectangle(drag.start, here);
    paint();
  });

  plane.addEventListener("pointerup", (event) => {
    if (!drag || drag.pointer !== event.pointerId) return;
    if (drag.kind === "draw" && !drag.moved && firstCorner) {
      area = rectangle(firstCorner, point(event));
      firstCorner = null;
    } else if (drag.kind === "draw" && !drag.moved) {
      firstCorner = point(event);
      area = null;
    } else firstCorner = null;
    if (area && (area.w < 2 || area.h < 2)) area = null;
    drag = null;
    paint();
  });

  plane.addEventListener("lostpointercapture", (event) => {
    if (!drag || drag.pointer !== event.pointerId) return;
    area = drag.before;
    drag = null;
    paint();
  });

  plane.addEventListener("pointerleave", () => {
    hoveredWindow = null;
    if (mode === "window") paint();
  });

  plane.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();
    if (mode === "window" && (key === "w" || key === "s")) {
      event.preventDefault();
      const index = windows.indexOf(selectedWindow);
      selectedWindow = windows[(index + (key === "s" ? 1 : windows.length - 1) + windows.length) % windows.length];
      paint();
    }
    const directions = { a: [-1, 0], w: [0, -1], s: [0, 1], d: [1, 0] };
    if (mode !== "area" || !directions[key] || event.ctrlKey || event.metaKey || event.altKey) return;
    event.preventDefault();
    const [dx, dy] = directions[key];
    area ||= { ...example };
    if (event.shiftKey) {
      area.w = clamp(area.w + dx * 8, 2, output.w - area.x);
      area.h = clamp(area.h + dy * 8, 2, output.h - area.y);
    } else area = moveBox(area, dx * 8, dy * 8);
    firstCorner = null;
    paint();
  });

  function makePNG(box) {
    const frame = document.createElement("canvas");
    frame.width = box.w;
    frame.height = box.h;
    const drawing = frame.getContext("2d");
    if (mode === "window") drawing.drawImage(box.image, 0, 0, box.w, box.h);
    else drawing.drawImage(scene, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
    return new Promise((resolve, reject) => {
      frame.toBlob((blob) => blob ? resolve(blob) : reject(new Error("PNG export failed")), "image/png");
    });
  }

  async function exportImage(action) {
    if (!canExport()) return;
    const box = currentSelection();
    exporting = true;
    paint();
    try {
      const png = makePNG(box);
      let copied = false;
      if (action === "copy" && navigator.clipboard?.write && window.ClipboardItem) {
        try {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": png })]);
          copied = true;
        } catch {
          // The embedded preview can still show and download the PNG.
        }
      }
      if (resultURL) URL.revokeObjectURL(resultURL);
      resultURL = URL.createObjectURL(await png);
      const download = find("result-file");
      download.href = resultURL;
      download.download = "mothership-screenshot-" + new Date().toISOString().replaceAll(":", "-") + ".png";
      find("thumbnail").src = resultURL;
      const status = action === "save" ? "PNG ready" : copied ? "Image copied" : "Clipboard unavailable in this preview";
      find("result-status").textContent = status + " · " + box.w + " × " + box.h + " px";
      find("result").hidden = false;
      closeTool();
      if (action === "save") download.click();
    } catch {
      find("guide").textContent = "The PNG could not be prepared. Try Copy or Save PNG again.";
    } finally {
      exporting = false;
      paint();
    }
  }

  for (const button of modeButtons) button.addEventListener("click", () => setMode(button.dataset.mode));
  copy.addEventListener("click", () => exportImage("copy"));
  save.addEventListener("click", () => exportImage("save"));
  find("cancel").addEventListener("click", () => { if (!exporting) closeTool(); });
  launcher.addEventListener("click", openTool);
  document.addEventListener("keydown", (event) => {
    if (event.key === "PrintScreen" && !event.repeat && !active) {
      event.preventDefault();
      openTool();
    }
    if (event.key === "Escape" && active && !exporting) {
      event.preventDefault();
      closeTool();
    }
  });
  new ResizeObserver(paint).observe(find("desktop"));
  document.addEventListener("DOMContentLoaded", () => {
    loadScene().catch(() => { find("guide").textContent = "The sample desktop could not be loaded."; });
  });
</script>
